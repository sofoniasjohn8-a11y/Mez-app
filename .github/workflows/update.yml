name: EAS Update (OTA)

on:
  push:
    branches:
      - main

jobs:
  update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Fix lru-cache version conflict for Babel
        run: |
          mkdir -p node_modules/@babel/helper-compilation-targets/node_modules/lru-cache
          npm pack lru-cache@5.1.1 --pack-destination /tmp/
          tar -xzf /tmp/lru-cache-5.1.1.tgz -C /tmp/lru-cache-extract/
          cp -r /tmp/lru-cache-extract/package/. node_modules/@babel/helper-compilation-targets/node_modules/lru-cache/

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify Expo login
        run: eas whoami

      - name: Publish EAS Update
        run: |
          eas update \
            --branch main \
            --message "Update from commit ${{ github.sha }}" \
            --non-interactive \
            --platform android
