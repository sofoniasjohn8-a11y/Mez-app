name: EAS Build (APK)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK on EAS
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify Expo login
        run: eas whoami

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --output ./mezmur-app.apk

      - name: Get APK URL from EAS
        id: build_url
        run: |
          URL=$(eas build:list --platform android --limit 1 --json --non-interactive | python3 -c "import sys,json; builds=json.load(sys.stdin); print(builds[0].get('artifacts',{}).get('buildUrl',''))")
          echo "apk_url=$URL" >> $GITHUB_OUTPUT
          echo "APK URL: $URL"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}
            
            APK download: ${{ steps.build_url.outputs.apk_url }}
          files: "*.apk"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
