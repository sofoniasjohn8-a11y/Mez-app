name: EAS Build (APK)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK on EAS
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify Expo login
        run: eas whoami

      - name: Generate package-lock.json
        run: npm install --legacy-peer-deps --package-lock-only

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Get APK URL
        id: apk
        run: |
          sleep 30
          URL=$(eas build:list --platform android --limit 1 --json --non-interactive | python3 -c "
          import sys, json
          builds = json.load(sys.stdin)
          b = builds[0]
          url = b.get('artifacts', {}).get('buildUrl', '')
          print(url if url else 'https://expo.dev/accounts/ictus-3/projects/mez-app/builds')
          ")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "APK URL: $URL"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ## ቤተ-ዕንዚራ ${{ github.ref_name }}

            ### APK ማውረጃ
            👉 [APK ያውርዱ](${{ steps.apk.outputs.url }})

            ለተጨማሪ: https://expo.dev/accounts/ictus-3/projects/mez-app/builds

            ---
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
