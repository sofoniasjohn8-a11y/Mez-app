name: EAS Build (APK)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Trigger EAS Build via API
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger EAS Build via REST API
        id: trigger
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            https://api.expo.dev/graphql \
            -d '{
              "query": "mutation CreateBuild($appId: ID!, $platform: AppPlatform!, $profile: String!) { build(appId: $appId, platform: $platform, buildProfile: $profile) { id status platform } }",
              "variables": {
                "appId": "e9c883a5-cc12-4c9b-b8d5-36aac1c842d9",
                "platform": "ANDROID",
                "profile": "preview"
              }
            }')
          echo "API Response: $RESPONSE"
          BUILD_ID=$(echo $RESPONSE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('build',{}).get('id','error'))" 2>/dev/null || echo "check-expo-dev")
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build triggered! ID: $BUILD_ID"
          echo "Track at: https://expo.dev/accounts/ictus-3/projects/mez-app/builds"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ## ቤተ-ዕንዚራ ${{ github.ref_name }}

            ### APK ማውረጃ
            👉 [Expo Builds](https://expo.dev/accounts/ictus-3/projects/mez-app/builds)

            Build ID: ${{ steps.trigger.outputs.build_id }}
            Commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
