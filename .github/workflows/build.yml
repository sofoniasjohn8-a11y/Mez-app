name: EAS Build (APK)

# Triggers when you push a version tag: git tag v1.0 && git push origin v1.0
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK on EAS
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      NPM_CONFIG_LEGACY_PEER_DEPS: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify Expo login
        run: eas whoami

      - name: Build APK on EAS servers
        run: eas build --platform android --profile preview --non-interactive

      - name: Get APK download URL
        id: apk
        run: |
          URL=$(eas build:list --platform android --limit 1 --json --non-interactive | python3 -c "
          import sys, json
          builds = json.load(sys.stdin)
          print(builds[0].get('artifacts', {}).get('buildUrl', 'not ready yet'))
          ")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "APK URL: $URL"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            ## ቤተ-ዕንዚራ ${{ github.ref_name }}

            ### APK ማውረጃ
            👉 [APK ያውርዱ](${{ steps.apk.outputs.url }})

            ### ምን አዲስ ነው
            - ይህን ስሪት ያዘጋጁ

            ---
            Built from commit ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
