name: EAS Build (APK)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build APK on EAS
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Fix lru-cache version conflict for Babel
        run: |
          mkdir -p node_modules/@babel/helper-compilation-targets/node_modules/lru-cache
          npm pack lru-cache@5.1.1 --pack-destination /tmp/
          tar -xzf /tmp/lru-cache-5.1.1.tgz --strip-components=1 -C node_modules/@babel/helper-compilation-targets/node_modules/lru-cache/

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Verify Expo login
        run: eas whoami

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Get APK URL and create Release
        run: |
          sleep 30
          URL=$(eas build:list --platform android --limit 1 --json --non-interactive | python3 -c "
          import sys, json
          builds = json.load(sys.stdin)
          b = builds[0]
          url = b.get('artifacts', {}).get('buildUrl', '')
          print(url if url else 'https://expo.dev/accounts/ictus-3/projects/mez-app/builds')
          " 2>/dev/null || echo "https://expo.dev/accounts/ictus-3/projects/mez-app/builds")

          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/sofoniasjohn8-a11y/Mez-app/releases \
            -d "{
              \"tag_name\": \"${{ github.ref_name }}\",
              \"name\": \"Release ${{ github.ref_name }}\",
              \"body\": \"## ቤተ-ዕንዚራ ${{ github.ref_name }}\n\n### APK ማውረጃ\n\n👉 [Expo Builds page](https://expo.dev/accounts/ictus-3/projects/mez-app/builds)\n\nAPK Direct: $URL\n\nCommit: ${{ github.sha }}\",
              \"draft\": false,
              \"prerelease\": false
            }"
